name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar deps e build web
        run: |
          npm ci
          npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar projeto Android
        run: |
          npx cap init "Continuum" "com.continuumnodes.continuum" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: android
        run: |
          cat >> build.gradle << 'EOF'
          
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
