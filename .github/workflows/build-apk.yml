name: Build Release APK Assinado

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar e enviar tags como v1.0.0, v1.0.1
    branches: [main]

permissions:
  contents: write # Permissão necessária para publicar na aba Releases do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detectar Diretório do Frontend
        id: detect-dir
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "FRONT_DIR=frontend" >> $GITHUB_ENV
            echo "ANDROID_DIR=frontend/android" >> $GITHUB_ENV
          else
            echo "FRONT_DIR=." >> $GITHUB_ENV
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
          fi

      - name: Instalar dependências e Build Web
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Instalar Capacitor e Assets Generator
        working-directory: ${{ env.FRONT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Preparar icon.png (fonte dos ícones)
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          set -e

          echo "Procurando favicon/icon/logo em todo o projeto..."

          CANDIDATOS=$(find . -type f \( -iname "favicon*.png" -o -iname "favicon*.svg" -o -iname "favicon*.ico" -o -iname "icon*.png" -o -iname "icon*.svg" -o -iname "logo*.png" -o -iname "logo*.svg" \) \
            -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "*/ios/*" -not -path "*/dist/*" 2>/dev/null)

          echo "Candidatos encontrados:"
          echo "$CANDIDATOS"

          # Prioridade 1: PNG dentro de public/
          SRC=$(echo "$CANDIDATOS" | grep -iE '\.png$' | grep -iE '(^|/)public/' | head -n 1)
          # Prioridade 2: qualquer PNG
          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.png$' | head -n 1)
          fi
          # Prioridade 3: SVG dentro de public/
          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.svg$' | grep -iE '(^|/)public/' | head -n 1)
          fi
          # Prioridade 4: qualquer SVG
          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.svg$' | head -n 1)
          fi
          # Prioridade 5: ICO
          if [ -z "$SRC" ]; then
            SRC=$(echo "$CANDIDATOS" | grep -iE '\.ico$' | head -n 1)
          fi

          if [ -z "$SRC" ]; then
            echo "ERRO: nenhum favicon/icon/logo encontrado em lugar nenhum do repositório."
            exit 1
          fi

          echo "Usando como fonte: $SRC"

          if [[ "$SRC" == *.ico ]] || [[ "$SRC" == *.svg ]]; then
            sudo apt-get update -qq && sudo apt-get install -y imagemagick
            convert "$SRC" -resize 1024x1024 icon.png
          else
            cp "$SRC" icon.png
          fi

          file icon.png

      - name: Inicializar projeto Android
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npx cap init "Continuum" "com.continuumnodes.continuum" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Gerar Ícones do App
        working-directory: ${{ env.FRONT_DIR }}
        run: npx @capacitor/assets generate --android

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Permissão de execução no Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      - name: Build APK Release
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleRelease

      - name: Decodificar e Assinar APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          # 1. Decodifica a Keystore a partir da Secret em Base64
          echo "$SIGNING_KEY" | base64 -d > keystore.jks

          # 2. Localiza as ferramentas do Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 3. Executa o zipalign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          # 4. Assina o APK usando apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$ALIAS_PASSWORD" \
            --out ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk \
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-aligned.apk

          # 5. Remove o arquivo sensível da keystore
          rm keystore.jks

      - name: Upload APK (sempre, independente de tag)
        uses: actions/upload-artifact@v4
        with:
          name: continuum-release-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          retention-days: 14

      - name: Definir nome da tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Criar GitHub Release e anexar APK Assinado
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          draft: false
          prerelease: false