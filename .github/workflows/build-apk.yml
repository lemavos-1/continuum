name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e Build Web
        run: |
          npm ci
          npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar projeto Android
        run: |
          npx cap init "Continuum" "com.continuumnodes.continuum" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: android
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Permissão de execução no Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Renomear APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/continuum-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: continuum-release-apk
          path: android/app/build/outputs/apk/release/continuum-release.apk
