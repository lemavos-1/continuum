name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar e enviar tags como v1.0.0, v1.0.1
    branches: [main]

permissions:
  contents: write # Permissão necessária para publicar na aba Releases do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e Build Web
        run: |
          npm ci
          npm run build

      - name: Instalar Capacitor e Assets Generator
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Copiar Favicon para a raiz como Icon
        run: |
          if [ -f public/favicon.png ]; then
            cp public/favicon.png icon.png
          elif [ -f public/favicon.ico ]; then
            cp public/favicon.ico icon.png
          elif [ -f dist/favicon.ico ]; then
            cp dist/favicon.ico icon.png
          fi

      - name: Inicializar projeto Android
        run: |
          npx cap init "Continuum" "com.continuumnodes.continuum" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Gerar Ícones do App
        run: npx @capacitor/assets generate --android

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: android
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Permissão de execução no Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Renomear APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/continuum-release.apk

      - name: Criar GitHub Release e anexar APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'latest' }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || 'latest' }}
          files: android/app/build/outputs/apk/release/continuum-release.apk
          draft: false
          prerelease: false
