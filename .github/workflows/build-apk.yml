name: Build Release APK Assinado

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar e enviar tags como v1.0.0, v1.0.1
    branches: [main]

permissions:
  contents: write # Permissão necessária para publicar na aba Releases do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detectar Diretório do Frontend
        id: detect-dir
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "FRONT_DIR=frontend" >> $GITHUB_ENV
            echo "ANDROID_DIR=frontend/android" >> $GITHUB_ENV
          else
            echo "FRONT_DIR=." >> $GITHUB_ENV
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
          fi

      - name: Instalar dependências e Build Web
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Instalar Capacitor e Assets Generator
        working-directory: ${{ env.FRONT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Copiar Favicon para Icon
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          if [ -f public/favicon.png ]; then
            cp public/favicon.png icon.png
          elif [ -f public/favicon.ico ]; then
            cp public/favicon.ico icon.png
          elif [ -f dist/favicon.ico ]; then
            cp dist/favicon.ico icon.png
          fi

      - name: Inicializar projeto Android
        working-directory: ${{ env.FRONT_DIR }}
        run: |
          npx cap init "Continuum" "com.continuumnodes.continuum" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Gerar Ícones do App
        working-directory: ${{ env.FRONT_DIR }}
        run: npx @capacitor/assets generate --android

      - name: Fix Kotlin stdlib duplicate classes
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          cat >> build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Permissão de execução no Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      - name: Build APK Release (Não assinado)
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleRelease

      - name: Assinar APK com a Keystore (Signature)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
          buildToolsVersion: '34.0.0'

      - name: Renomear APK Assinado
        run: |
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk

      - name: Criar GitHub Release e anexar APK Assinado
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'latest' }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || 'latest' }}
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/continuum-release.apk
          draft: false
          prerelease: false